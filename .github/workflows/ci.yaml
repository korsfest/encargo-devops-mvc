name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Unitarias con JUnit
        run: mvn clean test

      - name: Empaquetar microservicio
        run: mvn clean package -DskipTests

      - name: Construir imagen Docker
        run: docker build -t encargo-devops-mvc:latest .

      - name: Configurar Snyk CLI
        uses: snyk/actions/setup@master
      
      - name: Análisis de Seguridad con Snyk
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy:
    needs: build-test-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en AWS EC2 por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/encargo-devops-mvc
            git pull origin main
            sudo docker-compose down
            sudo docker-compose up -d --build --force-recreate