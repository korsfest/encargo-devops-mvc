version: '3.8'
services:
  app-mvc:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/sistema_db
      - DB_USER=root
      - DB_PASS=admin
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=sistema_db
      - MYSQL_ROOT_PASSWORD=admin
    ports:
      - "3306:3306"