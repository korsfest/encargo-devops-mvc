name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21 (sonar)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Unitarias y Cobertura (JUnit + JaCoCo)
        run: mvn clean test jacoco:report

      - name: Análisis de Calidad y Quality Gate (SonarCloud)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=korsfest_encargo-devops-mvc
          -Dsonar.organization=korsfest
          -Dsonar.qualitygate.wait=true

      - name: Configurar Snyk CLI
        uses: snyk/actions/setup@master

      - name: Análisis de Seguridad con Snyk (Bloqueo High/Critical)
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Empaquetar microservicio
        run: mvn package -DskipTests

      - name: Construir imagen Docker
        run: docker build -t encargo-devops-mvc:latest .

  deploy:
    needs: build-test-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en AWS EC2 y registrar métrica en CloudWatch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            START_TIME=$(date +%s)
            cd ~/encargo-devops-mvc
            git pull origin main
            sudo docker-compose down
            sudo docker-compose up -d --build --force-recreate
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            aws cloudwatch put-metric-data \
              --namespace "EncargoDevOps/Microservicio" \
              --metric-name "TiempoDespliegueSegundos" \
              --value $DURATION \
              --unit Seconds \
              --region us-east-1 || true