version: '3.8'

services:
  app-mvc:
    build:
      context: .
    container_name: app-mvc
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/sistema_db
      - DB_USER=root
      - DB_PASS=admin
      - AWS_REGION=us-east-1
    depends_on:
      - db
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /devops/encargo-mvc
        awslogs-stream: app-mvc-container
        awslogs-create-group: "true"

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      - MYSQL_DATABASE=sistema_db
      - MYSQL_ROOT_PASSWORD=admin
    ports:
      - "3306:3306"
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /devops/encargo-mvc
        awslogs-stream: mysql-db-container
        awslogs-create-group: "true"